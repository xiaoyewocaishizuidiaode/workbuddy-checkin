name: NewAPI Daily Checkin

# 推荐用 cron-job.org：08:00 主签到 + 09:00 看门狗（见 docs/cron-job-org-setup.md）
# schedule 仅作备份，GitHub 自带定时经常延迟
on:
  schedule:
    # 北京 08:00 = UTC 00:00（主签到备份）
    - cron: "0 0 * * *"
    # 北京 09:00 = UTC 01:00（看门狗备份）
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run New API checkin (multi-site)
        env:
          # 可选：整份 JSON 覆盖
          NEWAPI_SITES: ${{ secrets.NEWAPI_SITES }}
          # chshapi
          CHSHAPI_BASE_URL: ${{ secrets.CHSHAPI_BASE_URL }}
          CHSHAPI_ACCESS_TOKEN: ${{ secrets.CHSHAPI_ACCESS_TOKEN }}
          CHSHAPI_REFRESH: ${{ secrets.CHSHAPI_REFRESH }}
          CHSHAPI_SESSION: ${{ secrets.CHSHAPI_SESSION }}
          # sudobug
          SUDOBUG_BASE_URL: ${{ secrets.SUDOBUG_BASE_URL }}
          SUDOBUG_ACCESS_TOKEN: ${{ secrets.SUDOBUG_ACCESS_TOKEN }}
          SUDOBUG_USER_ID: ${{ secrets.SUDOBUG_USER_ID }}
          SUDOBUG_REFRESH: ${{ secrets.SUDOBUG_REFRESH }}
          SUDOBUG_SESSION: ${{ secrets.SUDOBUG_SESSION }}
          # hcnsec（账号1）
          HCNSEC_BASE_URL: ${{ secrets.HCNSEC_BASE_URL }}
          HCNSEC_ACCESS_TOKEN: ${{ secrets.HCNSEC_ACCESS_TOKEN }}
          HCNSEC_USER_ID: ${{ secrets.HCNSEC_USER_ID }}
          HCNSEC_REFRESH: ${{ secrets.HCNSEC_REFRESH }}
          HCNSEC_SESSION: ${{ secrets.HCNSEC_SESSION }}
          # hcnsec（账号2）
          HCNSEC2_BASE_URL: ${{ secrets.HCNSEC2_BASE_URL }}
          HCNSEC2_ACCESS_TOKEN: ${{ secrets.HCNSEC2_ACCESS_TOKEN }}
          HCNSEC2_USER_ID: ${{ secrets.HCNSEC2_USER_ID }}
          HCNSEC2_REFRESH: ${{ secrets.HCNSEC2_REFRESH }}
          HCNSEC2_SESSION: ${{ secrets.HCNSEC2_SESSION }}
        run: |
          if [ -z "$CHSHAPI_BASE_URL" ]; then export CHSHAPI_BASE_URL="https://api.chshapi.org"; fi
          if [ -z "$SUDOBUG_BASE_URL" ]; then export SUDOBUG_BASE_URL="https://sudobug.top"; fi
          if [ -z "$HCNSEC_BASE_URL" ]; then export HCNSEC_BASE_URL="https://api.hcnsec.cn"; fi
          if [ -z "$HCNSEC2_BASE_URL" ]; then export HCNSEC2_BASE_URL="https://api.hcnsec.cn"; fi
          python chshapi/checkin.py
