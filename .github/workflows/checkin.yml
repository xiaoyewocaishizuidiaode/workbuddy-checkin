name: WorkBuddy Daily Checkin

# 推荐用 cron-job.org：08:00 主签到 + 09:00 看门狗（见 docs/cron-job-org-setup.md）
# schedule 仅作备份，GitHub 自带定时经常延迟
on:
  schedule:
    # 北京 08:00 = UTC 00:00（主签到备份）
    - cron: "0 0 * * *"
    # 北京 09:00 = UTC 01:00（看门狗备份）
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run checkin
        env:
          WORKBUDDY_ACCESS_TOKEN: ${{ secrets.WORKBUDDY_ACCESS_TOKEN }}
          WORKBUDDY_ACCOUNT_NAME: ${{ secrets.WORKBUDDY_ACCOUNT_NAME }}
          WORKBUDDY_UID: ${{ secrets.WORKBUDDY_UID }}
          WORKBUDDY_DOMAIN: ${{ secrets.WORKBUDDY_DOMAIN }}
          WORKBUDDY_ENTERPRISE_ID: ${{ secrets.WORKBUDDY_ENTERPRISE_ID }}
        run: python checkin.py
